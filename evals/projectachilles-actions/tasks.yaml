# Small-model tool-calling eval task set — ProjectAchilles ACTIONS server.
# See evals/defender/tasks.yaml for the field schema. evals/test_eval_coverage.py
# enforces that every tool has at least one task. These measure the gated-write
# two-step callability question (see the eval-findings memory: Gemma-12B gap).
#
# EVERY task here pins its TARGET (test_id / schedule_id / task_id, and the
# hostname or tag it acts on). Without that, a model inventing a different UUID
# or naming the wrong host still scored 100% — the eval verified that the right
# TOOL was chosen and never that it was aimed at the right thing. These are the
# repo's gated writes; targeting is the whole question. (2026-07-27 audit.)

- prompt: "Run the ProjectAchilles test 3f2a9c10-1111-4222-8333-444455556666 on host web-01 now."
  expect_tool: run_test
  expect_args_contains: { test_id: 3f2a9c10-1111-4222-8333-444455556666, hostname: web-01 }

- prompt: "Execute validation test 8c1d2e30-2222-4333-9444-555566667777 against agent db-02."
  expect_tool: run_test
  expect_args_contains: { test_id: 8c1d2e30-2222-4333-9444-555566667777, hostname: db-02 }

- prompt: "Schedule test 3f2a9c10-1111-4222-8333-444455556666 to run daily at 02:30 on host web-01."
  expect_tool: schedule_test
  expect_args: { schedule: daily, run_time: "02:30" }
  expect_args_contains: { test_id: 3f2a9c10-1111-4222-8333-444455556666, hostname: web-01 }

- prompt: "Set up test 3f2a9c10-1111-4222-8333-444455556666 to run every sunday at 23:00 on web-01."
  expect_tool: schedule_test
  expect_args: { schedule: weekly, day: sunday }
  expect_args_contains: { test_id: 3f2a9c10-1111-4222-8333-444455556666, hostname: web-01 }

- prompt: "Pause the ProjectAchilles schedule sched-42."
  expect_tool: set_schedule_status
  expect_args: { status: paused }
  expect_args_contains: { schedule_id: sched-42 }

- prompt: "Resume schedule sched-42."
  expect_tool: set_schedule_status
  expect_args: { status: active }
  expect_args_contains: { schedule_id: sched-42 }

- prompt: "Cancel the pending ProjectAchilles test task task-99."
  expect_tool: cancel_tasks
  expect_args_contains: { task_id: task-99 }

- prompt: "What recurring ProjectAchilles test schedules do we have?"
  expect_tool: list_schedules

- prompt: "Did ProjectAchilles task task-99 finish yet?"
  expect_tool: get_task_status
  expect_args_contains: { task_id: task-99 }

- prompt: "show me what's still pending for the acme ransomware run"
  expect_tool: list_tasks
  origin: projectachilles-actions

- prompt: "cancel all the pending tests"
  expect_tool: cancel_tasks
  origin: projectachilles-actions

- prompt: "Run the ProjectAchilles test 3f2a9c10-1111-4222-8333-444455556666 on every host tagged windows-endpoints."
  expect_tool: run_test
  expect_args: { tag: windows-endpoints }
  expect_args_contains: { test_id: 3f2a9c10-1111-4222-8333-444455556666 }

- prompt: "Schedule test 3f2a9c10-1111-4222-8333-444455556666 daily at 02:30 on all hosts tagged prod-servers."
  expect_tool: schedule_test
  expect_args: { tag: prod-servers, schedule: daily }
  expect_args_contains: { test_id: 3f2a9c10-1111-4222-8333-444455556666 }

# Fleet-by-tag phrased as "hosts WITH TAG X" / "the X group" (not the tidy
# "tagged X"). This is the exact phrasing that made a small model try to
# enumerate hosts (list_agents/list_tasks) instead of passing `tag` to
# run_test — see the Hermes live-validation finding. Regression guard.
- prompt: "Run the ProjectAchilles test 3f2a9c10-1111-4222-8333-444455556666 on the hosts with tag group-b."
  expect_tool: run_test
  expect_args: { tag: group-b }
  expect_args_contains: { test_id: 3f2a9c10-1111-4222-8333-444455556666 }
  origin: projectachilles-actions

- prompt: "run the same test 3f2a9c10-1111-4222-8333-444455556666 on host with tag group-b"
  expect_tool: run_test
  expect_args: { tag: group-b }
  expect_args_contains: { test_id: 3f2a9c10-1111-4222-8333-444455556666 }
  origin: projectachilles-actions

- prompt: "Run test 3f2a9c10-1111-4222-8333-444455556666 on the group-b group of hosts."
  expect_tool: run_test
  expect_args: { tag: group-b }
  expect_args_contains: { test_id: 3f2a9c10-1111-4222-8333-444455556666 }
  origin: projectachilles-actions
